<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Что? Где? Когда?
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div
    id="intro-screen"
    class="screen"
>

    <video
        id="intro-video"
        autoplay
    >

        <source
            src="video/intro.mp4"
            type="video/mp4"
        >

    </video>

    <button id="skip-intro">
        Пропустить
    </button>

</div>

<div
    id="menu-screen"
    class="screen hidden"
>

    <h1>
        Что? Где? Когда?
    </h1>

    <button id="start-btn">
        Старт игры
    </button>

    <button id="show-intro-btn">
        Посмотреть заставку
    </button>

    <button id="settings-btn">
        Настройки
    </button>

</div>

<div
    id="roulette-screen"
    class="screen hidden"
>

    <div id="score">
        0:0
    </div>

    <canvas
        id="wheel"
        width="700"
        height="700"
    ></canvas>

    <button id="spin-btn">
        Крутить рулетку
    </button>

    <button id="back-menu-btn">
        Назад
    </button>

</div>

<div
    id="question-screen"
    class="screen hidden"
>

    <div id="score-question">
        0:0
    </div>

    <div id="top-timer-container">

        <div id="timer-label">
            ВРЕМЯ
        </div>

        <div id="timer">
            60
        </div>

    </div>

    <h2 id="question-title"></h2>

    <pre id="question-text"></pre>

    <button id="show-answer-btn">
        Показать ответ
    </button>

</div>

<div
    id="answer-screen"
    class="screen hidden"
>

    <div id="score-answer">
        0:0
    </div>

    <h2>
        Ответ
    </h2>

    <pre id="answer-text"></pre>

    <div class="answer-buttons">

        <button
            class="experts-btn"
            id="experts-win-btn"
        >

            Победили знатоки

        </button>

        <button
            class="viewers-btn"
            id="viewers-win-btn"
        >

            Победили зрители

        </button>

    </div>

</div>

<div
    id="settings-screen"
    class="screen hidden"
>

    <h2>
        Настройки
    </h2>

    <label>
        Время на вопрос
    </label>

    <input
        id="timer-setting"
        type="number"
        value="60"
    >

    <button id="save-settings-btn">
        Сохранить
    </button>

    <button id="settings-back-btn">
        Назад
    </button>

</div>

<script src="app.js"></script>

</body>

</html>
